name: X-Stat agent-field oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xstat-agent-oracle.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the owned CTF repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run a control and an inert delimiter differential
        shell: bash
        run: |
          set -euo pipefail
          run_push() {
            local label="$1"
            local agent="$2"
            local probe_ref="refs/heads/oracle/${label}-${GITHUB_RUN_ID}"

            set +e
            GIT_USER_AGENT="$agent" git push origin "HEAD:${probe_ref}" \
              2>&1 | tee "${label}-output.txt"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "ORACLE_${label^^}_RC=${rc}"
          }

          # Both values are valid Git protocol agents. The second field name
          # is intentionally unknown and has no server-side semantics.
          run_push control 'git/2.53'
          run_push inert_delimiter 'git/2.53;ctf_probe=bool:true'
