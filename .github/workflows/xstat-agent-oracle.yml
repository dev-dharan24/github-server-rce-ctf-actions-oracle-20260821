name: X-Stat agent-field oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xstat-agent-oracle.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the owned CTF repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare receive-pack session-id values
        shell: bash
        run: |
          set -euo pipefail
          run_push() {
            local label="$1"
            local parent_sid="$2"
            local probe_ref="refs/heads/oracle/session-id-${label}-${GITHUB_RUN_ID}"

            set +e
            GIT_USER_AGENT='git/2.53' \
            GIT_TRACE2_PARENT_SID="$parent_sid" \
            GIT_TRACE_PACKET=1 \
              git -c transfer.advertiseSID=true push origin \
                "HEAD:${probe_ref}" 2>&1 | tee "${label}-output.txt"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "ORACLE_${label^^}_RC=${rc}"
          }

          run_push control 'ctf-control'
          run_push inert_delimiter 'ctf;ctf_probe=bool:true'
