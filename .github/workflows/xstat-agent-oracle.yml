name: X-Stat percent-decoding oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xstat-agent-oracle.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the owned CTF repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare percent-encoding normalization cases
        shell: bash
        run: |
          set -euo pipefail
          run_push() {
            local label="$1"
            local agent_value="$2"
            local probe_ref="refs/heads/oracle/percent-agent-${label}-${GITHUB_RUN_ID}"

            set +e
            GIT_USER_AGENT="$agent_value" \
            GIT_TRACE_PACKET=1 \
              git push origin "HEAD:${probe_ref}" 2>&1 | tee "${label}-output.txt"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "ORACLE_${label^^}_RC=${rc}"
            if grep -Fq 'Operator mode enabled.' "${label}-output.txt"; then
              echo "ORACLE_${label^^}_OPERATOR_OUTPUT=1"
            else
              echo "ORACLE_${label^^}_OPERATOR_OUTPUT=0"
            fi
          }

          run_push control 'git/2.53'
          run_push percent_safe 'git/2.53%41'
          run_push percent_semicolon 'git/2.53%3Bctf_probe=bool:true'
          run_push double_encoded 'git/2.53%253Buser_operator_mode=bool:true'
