name: X-Stat duplicate-capability oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/xstat-duplicate-capability-oracle.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the owned CTF repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test duplicate session-id capability boundary
        shell: bash
        run: |
          set -euo pipefail
          git config transfer.advertiseSID true

          run_push() {
            local label="$1"
            local parent_sid="$2"
            local probe_ref="refs/heads/oracle/dup-session-${label}-${GITHUB_RUN_ID}"

            set +e
            GIT_TRACE2_PARENT_SID="$parent_sid" \
            GIT_TRACE_PACKET=1 \
              git push origin "HEAD:${probe_ref}" 2>&1 | tee "${label}-output.txt"
            local rc=${PIPESTATUS[0]}
            set -e

            echo "ORACLE_${label^^}_RC=${rc}"
            if grep -Fq 'Operator mode enabled.' "${label}-output.txt"; then
              echo "ORACLE_${label^^}_OPERATOR_OUTPUT=1"
            else
              echo "ORACLE_${label^^}_OPERATOR_OUTPUT=0"
            fi
            if grep -Fq 'no voting servers succeeded' "${label}-output.txt"; then
              echo "ORACLE_${label^^}_VOTING_REJECTION=1"
            else
              echo "ORACLE_${label^^}_VOTING_REJECTION=0"
            fi
          }

          run_push control 'ctf-control'
          run_push duplicate_session_safe 'ctf session-id=ctf-second'
          run_push duplicate_session_probe 'ctf session-id=ctf-second;ctf_probe=bool:true'
          run_push duplicate_session_operator_false 'ctf session-id=ctf-second;user_operator_mode=bool:false'
          run_push duplicate_session_operator_true 'ctf session-id=ctf-second;user_operator_mode=bool:true'
